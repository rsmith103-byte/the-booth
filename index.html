<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Booth">
<meta name="theme-color" content="#101922">
<title>The Booth</title>
<style>
:root{--ink:#101922;--panel:#18232F;--panel2:#1E2B39;--line:#2A3A49;--text:#E6EDF3;
 --muted:#8296A6;--flag:#F5C542;--hot:#D9455F;--ok:#4FB286;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--ink);color:var(--text);min-height:100vh;
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
 padding-bottom:calc(40px + env(safe-area-inset-bottom));}
.eyebrow{font-family:"American Typewriter","Courier New",monospace;text-transform:uppercase;
 letter-spacing:.16em;font-size:10px;color:var(--muted);}
.num{font-family:ui-monospace,Menlo,"SF Mono",monospace;font-variant-numeric:tabular-nums;}
.bar{position:sticky;top:0;z-index:20;background:rgba(16,25,34,.94);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
 display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.title{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.15;}
.wrap{padding:16px;max-width:640px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;
 margin-bottom:10px;width:100%;text-align:left;display:block;color:inherit;font-family:inherit;
 animation:rise .26s ease both;}
button.card:active{background:var(--panel2);}
@keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.lname{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.25;}
.sub{font-size:12px;color:var(--muted);margin-top:3px;}
.flagstack{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.flagcount{font-size:26px;font-weight:700;line-height:1;color:var(--flag);}
.pips{display:flex;flex-direction:column;gap:3px;}
.pip{width:16px;height:5px;border-radius:1px;background:var(--flag);transform:skewX(-20deg);}
.pip.hot{background:var(--hot);}
.clean{font-size:11px;color:var(--ok);font-weight:600;}
.tabs{display:flex;gap:4px;margin:2px 0 14px;background:var(--panel);border:1px solid var(--line);
 border-radius:11px;padding:4px;}
.tab{flex:1;padding:9px 4px;border-radius:8px;border:0;background:transparent;color:var(--muted);
 font-size:12px;font-weight:600;font-family:inherit;}
.tab.on{background:var(--panel2);color:var(--text);}
.sec{margin-bottom:22px;}
.sechd{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.sechd:after{content:"";flex:1;height:1px;background:var(--line);}
.item{border-left:2px solid var(--flag);padding:8px 0 8px 11px;margin-bottom:9px;font-size:13px;line-height:1.45;}
.item.hot{border-color:var(--hot);}
.item b{font-weight:600;}
.item .who{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;}
th{font-family:"American Typewriter","Courier New",monospace;font-size:9px;text-transform:uppercase;
 letter-spacing:.12em;color:var(--muted);font-weight:400;}
td.r,th.r{text-align:right;}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;
 padding:12px 14px;font-size:13px;font-weight:600;font-family:inherit;width:100%;margin-bottom:8px;}
.btn:active{background:var(--line);}
.btn.go{background:var(--flag);color:#101922;border-color:var(--flag);}
.btn.ghost{background:transparent;}
.btn[disabled]{opacity:.45;}
.inp{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
 border-radius:10px;padding:12px;font-size:16px;font-family:inherit;margin-bottom:10px;}
.inp:focus,.btn:focus-visible,.tab:focus-visible,.card:focus-visible{outline:2px solid var(--flag);outline-offset:2px;}
.chk{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);
 border-radius:10px;margin-bottom:7px;background:var(--panel);font-size:14px;}
.chk input{width:19px;height:19px;accent-color:var(--flag);flex-shrink:0;}
.note{font-size:12px;color:var(--muted);line-height:1.5;}
.banner{font-family:"American Typewriter","Courier New",monospace;text-transform:uppercase;
 letter-spacing:.14em;font-size:10px;color:var(--hot);border-top:1px solid var(--hot);
 padding-top:7px;margin:4px 0 12px;}
.banner.quiet{color:var(--muted);border-color:var(--line);margin-top:26px;}
.err{border:1px solid var(--hot);border-radius:10px;padding:12px;font-size:13px;line-height:1.5;
 background:rgba(217,69,95,.09);margin-bottom:12px;}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13px;line-height:1.6;}
.wk{display:flex;align-items:center;gap:2px;}
.wk button{background:transparent;border:1px solid var(--line);color:var(--text);width:32px;height:32px;
 border-radius:8px;font-size:15px;font-family:inherit;}
.back{background:transparent;border:0;color:var(--muted);font-size:13px;font-family:inherit;padding:0 0 12px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:50;background:var(--flag);
 color:#101922;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:650;
 box-shadow:0 6px 22px rgba(0,0,0,.45);}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= The Booth — dynasty commissioner console =================
   Sleeper public read API. No key. Nothing here writes to your leagues.
   ========================================================================= */

var API="https://api.sleeper.app/v1", INACTIVE_WEEKS=3, PICK_HORIZON=3;
var S={view:"boot",cfg:[],username:"",found:null,week:1,data:{},players:null,
       busy:false,pbusy:false,err:"",open:null,tab:"flags",toast:"",step:"",audit:false,allmoves:false,pfail:false};

/* ---------- storage (localStorage, degrades to memory) ---------- */
var mem={};
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){mem[k]=v;}}
function got(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):(mem[k]||null);}catch(e){return mem[k]||null;}}

/* ---------- api ---------- */
async function api(path){
  var r=await fetch(API+path);
  if(!r.ok){ if(r.status===404) return null; throw new Error(r.status); }
  var t=await r.text();
  return (t&&t!=="null")?JSON.parse(t):null;
}

async function loadLeague(id,week){
  var weeks=[]; for(var w=Math.max(1,week-INACTIVE_WEEKS+1);w<=week;w++) weeks.push(w);
  var res=await Promise.all([
    api("/league/"+id), api("/league/"+id+"/users"), api("/league/"+id+"/rosters"),
    api("/league/"+id+"/matchups/"+week), api("/league/"+id+"/traded_picks")
  ].concat(weeks.map(function(w){return api("/league/"+id+"/transactions/"+w);})));
  var meta=res[0]||{},users=res[1]||[],rosters=res[2]||[],matchups=res[3]||[],picks=res[4]||[];
  var byUser={}; users.forEach(function(u){byUser[u.user_id]=u;});
  var names={};
  rosters.forEach(function(rs){
    var u=byUser[rs.owner_id];
    names[rs.roster_id]=u?((u.metadata&&u.metadata.team_name)||u.display_name)
                         :("Orphan — roster "+rs.roster_id);
  });
  var txByWeek={}; weeks.forEach(function(w,i){txByWeek[w]=res[5+i]||[];});
  return {id:id,week:week,meta:meta,users:users,rosters:rosters,matchups:matchups,
          picks:picks,txByWeek:txByWeek,names:names};
}

/* ---------- helpers ---------- */
function pf(rs){var s=rs.settings||{};return (s.fpts||0)+(s.fpts_decimal||0)/100;}
function pa(rs){var s=rs.settings||{};return (s.fpts_against||0)+(s.fpts_against_decimal||0)/100;}
function rec(rs){var s=rs.settings||{};return (s.wins||0)+"-"+(s.losses||0)+(s.ties?"-"+s.ties:"");}
function pName(pid){
  var p=S.players&&S.players[String(pid)];
  if(!p) return "#"+pid;
  return p[0]+" ("+(p[1]||"?")+", "+(p[2]||"FA")+")";
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- flags ---------- */
function computeFlags(L){
  var out=[], who=function(r){return L.names[r]||("roster "+r);};
  function add(kind,text,rid,hot){out.push({kind:kind,text:text,who:who(rid),hot:!!hot,tier:hot?"core":"audit"});}

  L.matchups.forEach(function(m){
    var e=(m.starters||[]).filter(function(s){return String(s)==="0";}).length;
    if(e) add("Empty starting slots",e+" unfilled slot"+(e>1?"s":"")+" in week "+L.week,m.roster_id,true);
  });

  var active={};
  Object.keys(L.txByWeek).forEach(function(w){
    (L.txByWeek[w]||[]).forEach(function(t){
      if(t.status==="complete")(t.roster_ids||[]).forEach(function(r){active[r]=1;});
    });
  });
  L.rosters.forEach(function(rs){
    if(!active[rs.roster_id]) add("Gone quiet","No completed moves in "+INACTIVE_WEEKS+" weeks",rs.roster_id,true);
    if(!rs.owner_id) add("Orphan team","No owner attached to this roster",rs.roster_id,true);
  });

  if(S.players){
    L.rosters.forEach(function(rs){
      (rs.reserve||[]).forEach(function(pid){
        var st=(S.players[String(pid)]||[])[4];
        if(!st||st==="Questionable"||st==="Probable")
          add("IR misuse",pName(pid)+" on IR — status "+(st||"healthy"),rs.roster_id);
      });
    });
    var lim=(L.meta.settings||{}).taxi_years;
    if(lim) L.rosters.forEach(function(rs){
      (rs.taxi||[]).forEach(function(pid){
        var exp=(S.players[String(pid)]||[])[3];
        if(exp!=null&&exp>lim) add("Taxi eligibility",pName(pid)+" — "+exp+" yrs exp, limit "+lim,rs.roster_id);
      });
    });
  }

  var slots=(L.meta.roster_positions||[]).filter(function(p){return p!=="TAXI"&&p!=="IR";}).length;
  if(slots) L.rosters.forEach(function(rs){
    var act=(rs.players||[]).length-(rs.taxi||[]).length-(rs.reserve||[]).length;
    if(act>slots) add("Over roster limit",act+" active, cap is "+slots,rs.roster_id);
    else if(act<slots-2) add("Thin roster",act+" active of "+slots+" — check for abandonment",rs.roster_id);
  });

  var budget=(L.meta.settings||{}).waiver_budget;
  if(budget) L.rosters.forEach(function(rs){
    var left=budget-((rs.settings||{}).waiver_budget_used||0);
    if(left<=budget*0.1) add("FAAB spent","$"+left+" of $"+budget+" left",rs.roster_id);
  });

  var season=parseInt(L.meta.season||new Date().getFullYear(),10), seen={};
  L.picks.forEach(function(p){ if(parseInt(p.season,10)>season+PICK_HORIZON) seen[p.season]=1; });
  var far=Object.keys(seen).sort();
  if(far.length) out.push({tier:"audit",kind:"Pick horizon",who:"League-wide",
    text:"Picks traded for "+far.join(", ")+" — beyond "+PICK_HORIZON+" years out. Confirm the constitution allows it."});

  return out;
}

/* ---------- the post ---------- */
function leaguePost(L){
  var n=function(r){return L.names[r]||("roster "+r);}, lines=[L.meta.name+" — Week "+L.week,""];
  var pods={};
  L.matchups.forEach(function(m){ if(m.matchup_id){(pods[m.matchup_id]=pods[m.matchup_id]||[]).push(m);} });
  var pairs=Object.keys(pods).map(function(k){return pods[k];})
    .filter(function(p){return p.length===2;})
    .map(function(p){return p.sort(function(a,b){return (b.points||0)-(a.points||0);});});
  if(pairs.length){
    lines.push("SCORES");
    pairs.forEach(function(p){
      lines.push(n(p[0].roster_id)+" "+(p[0].points||0).toFixed(2)+" def. "+n(p[1].roster_id)+" "+(p[1].points||0).toFixed(2));
    });
    var close=pairs.map(function(p){return (p[0].points||0)-(p[1].points||0);}).sort(function(a,b){return a-b;})[0];
    var hi=L.matchups.slice().sort(function(a,b){return (b.points||0)-(a.points||0);})[0];
    lines.push("","High score: "+n(hi.roster_id)+", "+(hi.points||0).toFixed(2)+". Closest game: "+close.toFixed(2)+".","");
  }
  lines.push("STANDINGS");
  L.rosters.slice().sort(function(a,b){
    return ((b.settings||{}).wins||0)-((a.settings||{}).wins||0)||pf(b)-pf(a);
  }).forEach(function(rs,i){ lines.push((i+1)+". "+n(rs.roster_id)+"  "+rec(rs)+"  "+pf(rs).toFixed(1)+" PF"); });
  lines.push("");
  var txs=L.txByWeek[L.week]||[];
  var trades=txs.filter(function(t){return t.type==="trade"&&t.status==="complete";});
  var claims=txs.filter(function(t){return t.type==="waiver"&&t.status==="complete";});
  lines.push("MOVES");
  if(!trades.length&&!claims.length) lines.push("Quiet week.");
  trades.forEach(function(t){
    var bits=Object.keys(t.adds||{}).map(function(pid){return pName(pid)+" to "+n(t.adds[pid]);});
    (t.draft_picks||[]).forEach(function(p){bits.push(p.season+" rd "+p.round+" to "+n(p.owner_id));});
    lines.push("TRADE: "+bits.join("; "));
  });
  claims.sort(function(a,b){return ((b.settings||{}).waiver_bid||0)-((a.settings||{}).waiver_bid||0);})
    .slice(0,5).forEach(function(t){
      Object.keys(t.adds||{}).forEach(function(pid){
        var bid=(t.settings||{}).waiver_bid;
        lines.push(n(t.adds[pid])+" claimed "+pName(pid)+(bid?" ($"+bid+")":""));
      });
    });
  var dl=(L.meta.settings||{}).trade_deadline;
  if(dl&&dl>L.week) lines.push("","Trade deadline is week "+dl+" — "+(dl-L.week)+" weeks out.");
  return lines.join("\n");
}

function copyText(text,msg){
  function done(){ S.toast=msg; render(); setTimeout(function(){S.toast="";render();},1800); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){fallback();});
  } else fallback();
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta); done();
  }
}

/* ---------- actions ---------- */
async function boot(){
  S.cfg=got("booth:leagues")||[]; S.username=got("booth:user")||"";
  S.players=got("booth:players")||null;
  try{ var st=await api("/state/nfl"); S.week=(st&&(st.display_week||st.week))||1; }
  catch(e){ S.err="Couldn't reach Sleeper. Check your connection, then reload."; }
  S.view=S.cfg.length?"home":"setup"; render();
  if(S.cfg.length) refresh();
  if(!S.players) loadPlayers();
}

async function refresh(){
  S.busy=true; S.err=""; S.data={}; render();
  await Promise.all(S.cfg.map(async function(l){
    try{ S.data[l.league_id]=await loadLeague(l.league_id,S.week); render(); }
    catch(e){ S.err="Sleeper didn't answer for at least one league. Tap Refresh to retry."; }
  }));
  S.busy=false; render();
}

async function discover(){
  var name=(document.getElementById("u")||{}).value||S.username;
  S.username=name.trim(); S.busy=true; S.err=""; render();
  try{
    var u=await api("/user/"+encodeURIComponent(S.username));
    if(!u){ S.err='No Sleeper account named "'+S.username+'".'; S.busy=false; return render(); }
    var st=await api("/state/nfl");
    var ls=await api("/user/"+u.user_id+"/leagues/nfl/"+((st&&st.season)||new Date().getFullYear()));
    if(!ls||!ls.length){ S.err="That account isn't in any leagues this season."; S.busy=false; return render(); }
    S.step="Checking which ones you commission…"; render();
    var owns=await Promise.all(ls.map(async function(l){
      try{
        var us=await api("/league/"+l.league_id+"/users");
        var me=(us||[]).filter(function(x){return x.user_id===u.user_id;})[0];
        return !!(me&&me.is_owner);
      }catch(e){ return false; }
    }));
    var rows=ls.map(function(l,i){
      return {league_id:l.league_id,name:l.name,commish:owns[i],on:owns[i]};
    });
    rows.sort(function(a,b){ return (b.commish?1:0)-(a.commish?1:0); });
    if(!rows.some(function(r){return r.commish;})) rows.forEach(function(r){r.on=true;});
    S.found=rows; S.step="";
    put("booth:user",S.username);
  }catch(e){ S.err="Couldn't reach Sleeper. Try again in a moment."; }
  S.busy=false; render();
}

function saveLeagues(){
  S.cfg=S.found.filter(function(f){return f.on;})
    .map(function(f){return {league_id:f.league_id,name:f.name};});
  put("booth:leagues",S.cfg); S.found=null; S.view="home"; render(); refresh();
}

async function loadPlayers(){
  S.pbusy=true; render();
  try{
    var raw=await api("/players/nfl"), trim={};
    Object.keys(raw||{}).forEach(function(id){
      var p=raw[id], nm=p.full_name||[p.first_name,p.last_name].filter(Boolean).join(" ");
      if(nm) trim[id]=[nm,p.position||"",p.team||"",p.years_exp==null?null:p.years_exp,p.injury_status||null];
    });
    S.players=trim; put("booth:players",trim);
    S.toast="Player names loaded"; setTimeout(function(){S.toast="";render();},1800);
  }catch(e){ S.pfail=true; }
  S.pbusy=false; render();
}

function setWeek(d){
  S.week=Math.min(18,Math.max(1,S.week+d)); render(); refresh();
}

/* ---------- render ---------- */
function bar(title,sub,withWeek){
  return '<div class="bar"><div><div class="eyebrow">'+esc(sub)+'</div>'+
    '<div class="title">'+esc(title)+'</div></div>'+
    (withWeek?'<div class="wk"><button onclick="setWeek(-1)" aria-label="Previous week">‹</button>'+
      '<span class="eyebrow" style="min-width:56px;text-align:center">WK '+S.week+'</span>'+
      '<button onclick="setWeek(1)" aria-label="Next week">›</button></div>':'')+'</div>';
}

function viewSetup(){
  var h=bar("The Booth","Commissioner console",false)+'<div class="wrap">';
  if(S.err) h+='<div class="err">'+esc(S.err)+'</div>';
  if(!S.found){
    h+='<p class="eyebrow" style="margin-bottom:8px">Step one</p>'+
       '<p class="note" style="margin-bottom:14px">Enter your Sleeper username. Every league on the '+
       'account comes back — you pick the ones you commission.</p>'+
       '<input class="inp" id="u" value="'+esc(S.username)+'" placeholder="Sleeper username" '+
       'autocapitalize="none" autocorrect="off">'+
       '<button class="btn go" onclick="discover()"'+(S.busy?" disabled":"")+'>'+
       (S.busy?(S.step||"Looking…"):"Find my leagues")+'</button>';
  } else {
    var found=S.found.filter(function(f){return f.commish;}).length;
    h+='<p class="eyebrow" style="margin-bottom:8px">Step two</p>'+
       '<p class="note" style="margin-bottom:14px">'+
       (found? "Sleeper lists you as commissioner of "+found+" league"+(found>1?"s":"")+
               ", already checked below. Adjust if you co-commission one that isn't marked."
             : "Sleeper doesn't list you as commissioner of any of these, so they're all checked. "+
               "Uncheck the ones you only play in.")+'</p>';
    var wasCommish=null;
    S.found.forEach(function(f,i){
      if(f.commish!==wasCommish){
        wasCommish=f.commish;
        h+='<div class="sechd" style="margin:16px 0 9px"><span class="eyebrow">'+
           (f.commish?"You commission":"You only play in")+'</span></div>';
      }
      h+='<label class="chk"><input type="checkbox"'+(f.on?" checked":"")+
         ' onchange="S.found['+i+'].on=this.checked"><span>'+esc(f.name)+'</span></label>';
    });
    h+='<button class="btn go" style="margin-top:14px" onclick="saveLeagues()">Use the checked leagues</button>'+
       '<button class="btn ghost" onclick="S.found=null;render()">Start over</button>';
  }
  return h+'</div>';
}

function viewHome(){
  var total=0, minor=0, fl={};
  S.cfg.forEach(function(l){
    var L=S.data[l.league_id];
    fl[l.league_id]=L?computeFlags(L):null;
    (fl[l.league_id]||[]).forEach(function(f){ f.tier==="core"?total++:minor++; });
  });
  var loaded=Object.keys(S.data).length;
  var h=bar("The Booth",S.cfg.length+" leagues",true)+'<div class="wrap">';
  if(S.err) h+='<div class="err">'+esc(S.err)+'</div>';
  h+='<div class="row" style="margin-bottom:14px"><div><div class="eyebrow">Needs a message</div>'+
     '<div class="num" style="font-size:30px;font-weight:700;line-height:1.1;color:'+
     (total?"var(--hot)":"var(--ok)")+'">'+(loaded?total:"—")+'</div>'+
     (loaded&&minor?'<div class="note" style="margin-top:3px">'+minor+' housekeeping item'+(minor>1?"s":"")+'</div>':'')+'</div>'+
     '<div style="text-align:right"><div class="eyebrow">Week</div>'+
     '<div class="num" style="font-size:30px;font-weight:700;line-height:1.1">'+S.week+'</div></div></div>';
  if(!S.players&&S.pbusy)
    h+='<p class="note" style="margin-bottom:12px">Loading player names in the background…</p>';
  if(!S.players&&S.pfail)
    h+='<button class="btn" onclick="S.pfail=false;loadPlayers()">Player names didn\'t load — retry</button>';
  S.cfg.forEach(function(l){
    var L=S.data[l.league_id], f=fl[l.league_id];
    var hot=f?f.filter(function(x){return x.hot;}).length:0;
    var core=f?f.filter(function(x){return x.tier==="core";}):[];
    var right='';
    if(f&&!f.length) right='<span class="clean">CLEAN</span>';
    else if(f&&f.length){
      var lead=core.length?core:f;
      right='<div class="pips">'+lead.slice(0,4).map(function(x){
        return '<div class="pip'+(x.hot?" hot":"")+'"></div>';}).join("")+'</div>'+
        '<span class="flagcount num"'+(core.length?' style="color:var(--hot)"':'')+'>'+
        (core.length||f.length)+'</span>';
    }
    h+='<button class="card" onclick="S.open=\''+l.league_id+'\';S.tab=\'flags\';S.view=\'league\';render()">'+
       '<div class="row"><div style="min-width:0"><div class="lname">'+
       esc((L&&L.meta.name)||l.name)+'</div><div class="sub">'+
       (L?(L.rosters.length+" teams"+((L.meta.settings||{}).trade_deadline?
          " · deadline wk "+L.meta.settings.trade_deadline:"")+
          (core.length&&f.length>core.length?" · "+(f.length-core.length)+" housekeeping":"")):"Loading…")+
       '</div></div><div class="flagstack">'+right+'</div></div></button>';
  });
  h+='<button class="btn ghost" style="margin-top:14px" onclick="refresh()">'+
     (S.busy?"Refreshing…":"Refresh all leagues")+'</button>'+
     '<button class="btn ghost" onclick="S.found=null;S.view=\'setup\';render()">Change leagues</button>';
  return h+'</div>';
}

function viewLeague(){
  var L=S.data[S.open];
  if(!L) return bar("Loading","",false)+'<div class="empty">Still loading that league.</div>';
  var flags=computeFlags(L);
  var h=bar(L.meta.name,"Week "+L.week,true)+'<div class="wrap">'+
    '<button class="back" onclick="S.view=\'home\';render()">‹ All leagues</button><div class="tabs">';
  [["flags","Flags"+(flags.length?" ("+flags.length+")":"")],["standings","Standings"],
   ["scores","Scores"],["moves","Moves"]].forEach(function(t){
    h+='<button class="tab'+(S.tab===t[0]?" on":"")+'" onclick="S.tab=\''+t[0]+'\';render()">'+t[1]+'</button>';
  });
  h+='</div>';

  if(S.tab==="flags"){
    if(!flags.length) h+='<div class="empty">Nothing to chase in this league.<br>Enjoy the quiet week.</div>';
    function block(list){
      var groups={};
      list.forEach(function(f){(groups[f.kind]=groups[f.kind]||[]).push(f);});
      var out="";
      Object.keys(groups).forEach(function(k){
        out+='<div class="sec"><div class="sechd"><span class="eyebrow">'+esc(k)+'</span></div>';
        groups[k].forEach(function(f){
          out+='<div class="item'+(f.hot?" hot":"")+'"><b>'+esc(f.text)+'</b>'+
               '<span class="who">'+esc(f.who)+'</span></div>';
        });
        out+='</div>';
      });
      return out;
    }
    var core=flags.filter(function(f){return f.tier==="core";});
    var audit=flags.filter(function(f){return f.tier!=="core";});
    if(core.length){
      h+='<div class="banner">Worth a message this week</div>'+block(core);
    }
    if(audit.length){
      h+='<div class="banner quiet">Housekeeping — no rush</div>'+block(audit);
    }
    if(!S.players) h+='<p class="note">IR and taxi checks fill in once player names finish loading.</p>';
    if(flags.length) h+='<button class="btn" onclick="copyFlags()">Copy flags for my notes</button>';
  }

  if(S.tab==="standings"){
    h+='<table><thead><tr><th>#</th><th>Team</th><th class="r">Rec</th><th class="r">PF</th>'+
       '<th class="r">PA</th></tr></thead><tbody>';
    L.rosters.slice().sort(function(a,b){
      return ((b.settings||{}).wins||0)-((a.settings||{}).wins||0)||pf(b)-pf(a);
    }).forEach(function(rs,i){
      h+='<tr><td class="num" style="color:var(--muted)">'+(i+1)+'</td><td>'+esc(L.names[rs.roster_id])+
         '</td><td class="r num">'+rec(rs)+'</td><td class="r num">'+pf(rs).toFixed(1)+
         '</td><td class="r num" style="color:var(--muted)">'+pa(rs).toFixed(1)+'</td></tr>';
    });
    h+='</tbody></table>';
  }

  if(S.tab==="scores"){
    var pods={};
    L.matchups.forEach(function(m){ if(m.matchup_id){(pods[m.matchup_id]=pods[m.matchup_id]||[]).push(m);} });
    var keys=Object.keys(pods);
    if(!keys.length) h+='<div class="empty">No matchups posted for week '+L.week+'.</div>';
    keys.forEach(function(k){
      h+='<div class="card" style="animation:none">';
      pods[k].sort(function(a,b){return (b.points||0)-(a.points||0);}).forEach(function(m){
        h+='<div class="row" style="padding:3px 0"><span style="font-size:13px">'+
           esc(L.names[m.roster_id])+'</span><span class="num" style="font-size:15px;font-weight:600">'+
           (m.points||0).toFixed(2)+'</span></div>';
      });
      h+='</div>';
    });
  }

  if(S.tab==="moves"){
    var txs=(L.txByWeek[L.week]||[]).filter(function(t){return t.status==="complete";});
    if(!txs.length) h+='<div class="empty">No completed moves in week '+L.week+'.</div>';
    var trades=txs.filter(function(t){return t.type==="trade";});
    var rest=txs.filter(function(t){return t.type!=="trade";});
    function card(t){
      var bid=(t.settings||{}).waiver_bid, body="";
      Object.keys(t.adds||{}).forEach(function(pid){
        body+='<div style="font-size:13px;margin-bottom:3px">'+esc(pName(pid))+
              ' <span style="color:var(--muted)">to</span> '+esc(L.names[t.adds[pid]])+'</div>';
      });
      Object.keys(t.drops||{}).forEach(function(pid){
        body+='<div style="font-size:13px;margin-bottom:3px;color:var(--muted)">'+esc(pName(pid))+
              ' dropped by '+esc(L.names[t.drops[pid]])+'</div>';
      });
      (t.draft_picks||[]).forEach(function(p){
        body+='<div style="font-size:13px;margin-bottom:3px">'+p.season+' round '+p.round+
              ' <span style="color:var(--muted)">to</span> '+esc(L.names[p.owner_id])+'</div>';
      });
      if(!body) return "";
      return '<div class="card" style="animation:none"><div class="eyebrow" style="margin-bottom:6px">'+
        (t.type==="trade"?"Trade":t.type==="waiver"?"Waiver":"Free agent")+(bid?" · $"+bid:"")+
        '</div>'+body+'</div>';
    }
    if(trades.length){
      h+='<div class="sechd"><span class="eyebrow">Trades</span></div>';
      trades.forEach(function(t){h+=card(t);});
    }
    if(rest.length){
      h+='<div class="sechd" style="margin-top:18px"><span class="eyebrow">Waivers and free agents</span></div>';
      if(!S.allmoves){
        rest.slice(0,6).forEach(function(t){h+=card(t);});
        if(rest.length>6) h+='<button class="btn ghost" onclick="S.allmoves=1;render()">Show all '+
          rest.length+' claims</button>';
      } else rest.forEach(function(t){h+=card(t);});
    }
  }

  h+='<button class="btn go" style="margin-top:18px" onclick="copyPost()">Copy the league post</button>'+
     '<p class="note">Scores, standings and moves only. Flags stay out of it.</p>';
  return h+'</div>';
}

function copyPost(){ copyText(leaguePost(S.data[S.open]),"Post copied"); }
function copyFlags(){
  var f=computeFlags(S.data[S.open]);
  copyText(f.map(function(x){return "- "+x.kind+": "+x.who+" — "+x.text;}).join("\n"),"Flags copied");
}

function render(){
  var h;
  if(S.view==="boot") h='<div class="empty">Checking in with Sleeper…</div>';
  else if(S.view==="setup") h=viewSetup();
  else if(S.view==="home") h=viewHome();
  else h=viewLeague();
  if(S.toast) h+='<div class="toast">'+esc(S.toast)+'</div>';
  document.getElementById("app").innerHTML=h;
}

render(); boot();
</script>
</body>
</html>
